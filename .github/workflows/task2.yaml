name : task-2-assignment
on: 
  push:
    branches:
      - github-actions-task-2
    paths:
      - "dockerfile"
permissions:
  contents: write
jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set dynamic image tag
        id: vars
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          IMAGE_TAG="${BRANCH_NAME}-${SHORT_SHA}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "Image tag will be: $IMAGE_TAG"

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/my-app:${{ env.IMAGE_TAG }} .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/my-app:${{ env.IMAGE_TAG }}

      - name: Update Helm values.yaml
        run: |
          sed -i "s|tag:.*|tag: \"${IMAGE_TAG}\"|g" chart1/values.yaml

      - name: Commit Helm chart update
        run: |
          git config --global user.email "honey.bhandari@syvora.com"
          git config --global user.name "Honey Bhandari"
          git add chart1/values.yaml
          git commit -m "Update image tag to $IMAGE_TAG"
          git push origin HEAD:${GITHUB_REF#refs/heads/}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}