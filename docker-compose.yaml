services:
  postgres:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honeybhandari -d permalist"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: on-failure:3

  backend: 
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - postgres
    restart: on-failure:3
volumes:
  postgres_data: